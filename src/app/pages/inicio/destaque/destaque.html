<section class="hero" aria-labelledby="hero-title">
  <div class="hero-container">

    <!-- Imagem em primeiro para empilhar no topo no mobile -->
    <div class="hero-visual">
      <img
        class="hero-image"
        [src]="heroPesquisaLaboratorioUrl"
        alt="Pesquisadores trabalhando juntos"
      />
    </div>

    <div class="hero-content">
      <p class="hero-eyebrow">
        PESQUISA • CIÊNCIA • INOVAÇÃO
      </p>

      <h1 id="hero-title">
        Pesquisa, ciência e inovação para transformar conhecimento.
      </h1>

      <p class="hero-description">
        O Cogito Lab desenvolve pesquisas em engenharia de software,
        inteligência artificial e tecnologias emergentes, conectando
        conhecimento científico, inovação e impacto.
      </p>

      <a class="hero-button" href="/pesquisa">
        Conheça nossas pesquisas
      </a>
    </div>

  </div>
</section>
